# PostgreSQL. Configure via variáveis de ambiente (ver README).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: materia_devops_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
test:
  <<: *default
  database: materia_devops_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "materia_devops_production" } %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "materia_devops_production" } %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "materia_devops_production" } %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME") { "materia_devops_production" } %>_cable
    migrations_paths: db/cable_migrate
